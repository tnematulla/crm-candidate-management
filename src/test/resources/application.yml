server:
  port: 0

spring:
  application:
    name: crm_demo_test
  datasource:
    url: jdbc:h2:mem:crm_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

crm:
  batch:
    chunk-size: 10
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
