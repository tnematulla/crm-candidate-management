server:
  port: 8085

spring:
  application:
    name: crm_demo
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:crm_demo_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

crm:
  batch:
    chunk-size: 50
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
